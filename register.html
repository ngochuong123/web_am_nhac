<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Nhập Tiên Môn | Diệu Âm Tiên Cảnh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>

    <div class="xianxia-bg">
        <div class="mist"></div>
        <div class="qi-glow glow-1"></div>
        <div class="qi-glow glow-2"></div>
    </div>

    <div class="container">
        <div class="register-card">
            <div class="card-header">
                <div class="sect-icon">
                    <i class="fa-solid fa-scroll"></i>
                </div>
                <h2>ĐĂNG KÝ</h2>
                <p>Khắc tên vào thương khung, khởi đầu lộ trình tìm kiếm âm luật</p>
            </div>

            <form id="registerForm">
                <div class="input-box">
                    <i class="fa-solid fa-user-pen"></i>
                    <input type="text" id="username" placeholder="Đạo hiệu (Tên tài khoản)" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-feather"></i>
                    <input type="email" id="email" placeholder="Phúc địa (Email)" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="password" placeholder="Mật pháp (Mật khẩu)" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-fingerprint"></i>
                    <input type="password" id="confirmPassword" placeholder="Xác nhận mật pháp" required>
                </div>

                <button type="submit" class="btn-ascend">
                    <span>SẴN SÀNG</span>
                </button>
            </form>

            <div class="card-footer">
                Đã có tài khoản? <a href="login.html">Trở về đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>

</html>
