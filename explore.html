<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinh Không Khám Phá | Diệu Âm Tiên Cảnh</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/explore.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <span>DIỆU ÂM <br>TIÊN CẢNH</span>
            </div>
            <nav class="menu">
                <div class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> <span
                        data-lang="home_menu">Trang chủ</span></div>
                <div class="menu-item active"><i class="fas fa-compass"></i> <span data-lang="explore_menu">Khám
                        phá</span></div>
                <div class="menu-item"><i class="fas fa-rss"></i> <span data-lang="radio_menu">Radio</span></div>
                <div class="menu-item"><i class="fas fa-list-ul"></i> <span data-lang="playlist_menu">Playlist</span>
                </div>
                <div class="menu-item"><i class="fas fa-music"></i> <span data-lang="library_menu">Thư viện</span></div>
                <div class="menu-item"><i class="fas fa-heart"></i> <span data-lang="favorite_menu">Yêu thích</span>
                </div>
                <div class="menu-item"><i class="fas fa-history"></i> <span data-lang="history_menu">Lịch sử</span>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <!-- HEADER -->
            <header class="header">
                <div class="top-nav">
                    <span onclick="window.location.href='index.html'" data-lang="home_menu">Trang chủ</span>
                    <span class="active" data-lang="explore_menu">Khám phá</span>
                    <span data-lang="genre_menu">Thể loại</span>
                    <span data-lang="artist_menu">Nghệ thuật</span>
                </div>
                <div class="header-right">
                    <div class="lang-switch">
                        <span onclick="changeLanguage('vi')" id="btn-vi">VN</span> |
                        <span onclick="changeLanguage('en')" id="btn-en">EN</span>
                    </div>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" data-lang-placeholder="search_placeholder">
                    </div>
                    <div class="auth-buttons" id="auth-zone"></div>
                </div>
            </header>

            <!-- EXPLORE AREA -->
            <section class="explore-area">
                <div class="world-map-container">
                    <h2 class="map-title" data-lang="map_header">ÂM LUẬT TỨ HẢI</h2>

                    <div class="map-wrapper">
                        <!-- Bản đồ nền -->
                        <img src="https://simplemaps.com/static/svg/world/world.svg" class="world-map-img"
                            onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg'">

                        <!-- Các điểm mốc Châu Lục: Chuyển sang class continent-item để ghim tọa độ -->
                        <div class="continent-item america" onclick="selectContinent('america')">
                            <div class="continent-tag" data-lang="america_name">CHÂU MỸ</div>
                            <div class="pulse-point"></div>
                        </div>

                        <div class="continent-item europe" onclick="selectContinent('europe')">
                            <div class="continent-tag" data-lang="europe_name">CHÂU ÂU</div>
                            <div class="pulse-point"></div>
                        </div>

                        <div class="continent-item africa" onclick="selectContinent('africa')">
                            <div class="continent-tag" data-lang="africa_name">CHÂU PHI</div>
                            <div class="pulse-point"></div>
                        </div>

                        <div class="continent-item asia" onclick="selectContinent('asia')">
                            <div class="continent-tag" data-lang="asia_name">CHÂU Á</div>
                            <div class="pulse-point"></div>
                        </div>

                        <div class="continent-item oceania" onclick="selectContinent('oceania')">
                            <div class="continent-tag" data-lang="oceania_name">CHÂU ĐẠI DƯƠNG</div>
                            <div class="pulse-point"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/lang.js"></script>
    <script src="/js/explore.js"></script>
</body>

</html>
