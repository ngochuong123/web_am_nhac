<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linh Đài Nhập Cảnh | Diệu Âm Tiên Cảnh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <div class="xianxia-bg">
        <div class="mist"></div>
        <div class="qi-glow glow-1"></div>
        <div class="qi-glow glow-2"></div>
    </div>

    <div class="container">
        <div class="register-card">
            <div class="card-header">
                <div class="sect-icon">
                    <i class="fa-solid fa-yin-yang"></i>
                </div>
                <h2>ĐĂNG NHẬP</h2>
                <p>Xác nhận đạo tâm, tiếp tục hành trình tu luyện</p>
            </div>

            <form id="loginForm">
                <div class="input-box">
                    <i class="fa-solid fa-om"></i>
                    <input type="text" id="username" placeholder="Đạo hiệu hoặc Email" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="password" placeholder="Mật pháp (Mật khẩu)" required>
                </div>

                <div class="forgot-link" style="text-align: right; margin: -15px 5px 25px 0;">
                    <a href="#" style="font-size: 0.75rem; color: #889; text-decoration: none;">Thất lạc mật pháp?</a>
                </div>

                <button type="submit" class="btn-ascend">
                    <span>SẴN SÀNG</span>
                </button>
            </form>

            <div class="card-footer">
                Chưa có linh căn? <a href="register.html">Khai mở ngay</a>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>

</html>
